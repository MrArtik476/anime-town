# ОТКЛЮЧЕНО: запуск по расписанию переехал в Supabase (ADR-024) — Edge Function `translate-cron`,
# которую раз в сутки в 03:17 UTC вызывает Supabase Cron (pg_cron + pg_net). GitHub Actions для аккаунта
# недоступен (ограничение биллинга), поэтому `schedule` убран; файл оставлен с ручным запуском на случай,
# если Actions снова заработает. Запуск отмечается в translation_runs и не пересекается с Supabase Cron.
#
# Ручной запуск выполняет `npm run translate` — тот же runTranslationBackfill. Секреты репозитория:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TRANSLATOR_PROVIDER (deepl), TRANSLATOR_API_KEY.
name: Translate backfill (manual only)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько тайтлов перевести (1–100; пусто — все кандидаты)"
        required: false
        default: ""
        type: string

# Не больше одного заполнения одновременно; запущенное не отменяем, следующее ждёт.
concurrency:
  group: translate-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Перевод описаний (DeepL → anime_localizations)
        # Ввод передаётся через env, а не подстановкой в команду; скрипт сам проверяет диапазон.
        run: npm run translate -- --limit="$LIMIT"
        env:
          LIMIT: ${{ inputs.limit }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRANSLATOR_PROVIDER: ${{ secrets.TRANSLATOR_PROVIDER }}
          TRANSLATOR_API_KEY: ${{ secrets.TRANSLATOR_API_KEY }}
